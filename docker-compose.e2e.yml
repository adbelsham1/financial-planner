services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: financial_planner_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financial_planner_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10
